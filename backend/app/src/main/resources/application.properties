spring.application.name=app

# Nạp application-local.properties nếu có (gitignore) — không cần profile "local"; ưu tiên sau cùng gộp với biến môi trường.
spring.config.import=optional:classpath:application-local.properties

server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5435/restaurent-management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# flyway Configuration
spring.flyway.enabled=true
app.flyway.repair-before-migrate=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.initialization-fail-timeout=-1

# Redis Configuration (optional - for token caching)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ========================================
# EMAIL / SMTP CONFIGURATION
# ========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL cho link verify trong email
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# AOP Configuration
spring.aop.auto=true
spring.aop.proxy-target-class=true

# JWT — Dùng JWT_SECRET (env) hoặc jwt.secret trong application-local.properties.
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.verification-expiration=${JWT_VERIFICATION_EXPIRATION:900000}

# ========================================
# SPRING BOOT DEVTOOLS CONFIGURATION
# ========================================

# Enable automatic restart
spring.devtools.restart.enabled=true
# Exclude static resources from triggering restart
spring.devtools.restart.exclude=static/**,public/**,templates/**,META-INF/maven/**,META-INF/resources/**
# Enable live reload
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729
# thêm các path để watch for changes
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

# ========================================
# LOGGING CONFIGURATION
# ========================================

# Root logging level
logging.level.root=DEBUG

# Spring Boot internal logging (giảm noise)
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache=WARN

# Database connection pool logging
logging.level.com.zaxxer.hikari=WARN
logging.level.com.zaxxer.hikari.pool=WARN

# Redis client logging
logging.level.io.lettuce=WARN
logging.level.io.netty=WARN

# JDK security logging
logging.level.jdk.event.security=WARN

# JDBC / driver
logging.level.org.postgresql=WARN

# JMX/RMI logging (monitoring tools)
logging.level.javax.management=WARN
logging.level.javax.management.mbeanserver=WARN
logging.level.sun.rmi=WARN
logging.level.java.management=WARN

# Spring Boot Actuator logging
logging.level.org.springframework.boot.actuate=WARN

# HTTP connection logging
logging.level.sun.net.www.protocol.http=WARN

# Redisson Redis client logging
logging.level.org.redisson=WARN

# Console pattern với màu sắc và thời gian
logging.pattern.console=%clr([%d{dd-MM-yyyy HH:mm:ss.SSS}]){green} %clr([%-5level]){magenta} %clr(%logger{0}){cyan} - %clr(%msg){default}%n
spring.output.ansi.enabled=always
# logging.pattern.console.ansi=true

# File pattern
logging.pattern.file=%d{dd-MM-yyyy HH:mm:ss} [%t] %-5level [%logger{0}] - %msg%n

# restaurant management specific logging file location
logging.file.name=../logs/restaurant-management-application.log

# ========================================
# KAFKA CONFIGURATION
# ========================================

# Kafka Configuration - Railway provides KAFKA_URL or KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_URL:localhost:9092}}
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:true}

# Consumer Configuration
spring.kafka.consumer.group-id=restaurant-management-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5
spring.kafka.producer.buffer-memory=33554432

# ========================================================================================================================
# RESILIENCE4J RATE LIMITER CONFIGURATION
# ========================================================================================================================

# config chung cho read operations
resilience4j.ratelimiter.configs.controller-default-read.limitForPeriod=100
resilience4j.ratelimiter.configs.controller-default-read.limitRefreshPeriod=PT1M
resilience4j.ratelimiter.configs.controller-default-read.timeoutDuration=PT0S

# config chung cho write operations
resilience4j.ratelimiter.configs.controller-default-write.limitForPeriod=30
resilience4j.ratelimiter.configs.controller-default-write.limitRefreshPeriod=PT1M
resilience4j.ratelimiter.configs.controller-default-write.timeoutDuration=PT0S

# config cho public endpoints (rộng hơn)
resilience4j.ratelimiter.configs.controller-public-read.limitForPeriod=200
resilience4j.ratelimiter.configs.controller-public-read.limitRefreshPeriod=PT1M
resilience4j.ratelimiter.configs.controller-public-read.timeoutDuration=PT0S

resilience4j.ratelimiter.configs.controller-public-write.limitForPeriod=100
resilience4j.ratelimiter.configs.controller-public-write.limitRefreshPeriod=PT1M
resilience4j.ratelimiter.configs.controller-public-write.timeoutDuration=PT0S

# ======================================== Public (shared instances dùng bởi nhiều controller) ========================================
resilience4j.ratelimiter.instances.controller-public-read.base-config=controller-public-read
resilience4j.ratelimiter.instances.controller-public-write.base-config=controller-public-write

# ======================================== Category Controller ========================================
resilience4j.ratelimiter.instances.category-controller-staff-write.base-config=controller-default-write

# ======================================== MenuItem Controller ========================================
resilience4j.ratelimiter.instances.menu-item-controller-staff-write.base-config=controller-default-write

# ======================================== Order Controller ========================================
resilience4j.ratelimiter.instances.order-controller-customer-read.base-config=controller-default-read
resilience4j.ratelimiter.instances.order-controller-staff-read.base-config=controller-default-read

resilience4j.ratelimiter.instances.order-controller-customer-write.base-config=controller-default-write
resilience4j.ratelimiter.instances.order-controller-staff-write.base-config=controller-default-write

# ======================================== OrderItem Controller ========================================
resilience4j.ratelimiter.instances.order-item-controller-customer-write.base-config=controller-default-write
resilience4j.ratelimiter.instances.order-item-controller-staff-write.base-config=controller-default-write

# ======================================== Payment Controller ========================================
resilience4j.ratelimiter.instances.payment-controller-staff-read.base-config=controller-default-read
resilience4j.ratelimiter.instances.payment-controller-staff-write.base-config=controller-default-write

resilience4j.ratelimiter.instances.payment-controller-init.base-config=controller-default-write
# ======================================== Reservation Controller ========================================
resilience4j.ratelimiter.instances.reservation-controller-customer-read.base-config=controller-default-read
resilience4j.ratelimiter.instances.reservation-controller-customer-write.base-config=controller-default-write

resilience4j.ratelimiter.instances.reservation-controller-staff-read.base-config=controller-default-read
resilience4j.ratelimiter.instances.reservation-controller-staff-write.base-config=controller-default-write

resilience4j.ratelimiter.instances.reservation-controller-availability.base-config=controller-default-read
resilience4j.ratelimiter.instances.reservation-controller-availability.limitForPeriod=150
# ======================================== Shift Controller ========================================
resilience4j.ratelimiter.instances.shift-controller-staff-read.base-config=controller-default-read
resilience4j.ratelimiter.instances.shift-controller-staff-write.base-config=controller-default-write

# ======================================== Table Controller ========================================
resilience4j.ratelimiter.instances.table-controller-staff-write.base-config=controller-default-write

# ======================================== User Controller ========================================
resilience4j.ratelimiter.instances.user-controller-customer-write.base-config=controller-default-write

resilience4j.ratelimiter.instances.user-controller-staff-read.base-config=controller-default-read
resilience4j.ratelimiter.instances.user-controller-staff-write.base-config=controller-default-write

resilience4j.ratelimiter.instances.user-controller-login-logout.base-config=controller-public-write
resilience4j.ratelimiter.instances.user-controller-login-logout.limitForPeriod=150

resilience4j.ratelimiter.instances.user-controller-register-verify.base-config=controller-public-write
resilience4j.ratelimiter.instances.user-controller-register-verify.limitForPeriod=150

# ======================================== VNPAY Controller ========================================
resilience4j.ratelimiter.instances.vnpay-payment-controller-init.base-config=controller-default-write
resilience4j.ratelimiter.instances.vnpay-payment-controller-init.limitForPeriod=300

# ========================================================================================================================
# RESILIENCE4J CIRCUIT BREAKER CONFIGURATION
# ========================================================================================================================

# ignoreExceptions (chung): lỗi nghiệp vụ / trùng dữ liệu / xung đột version — DB & Redis vẫn OK.
# KHÔNG ignore: connection timeout, pool exhausted, RedisConnectionFailure, QueryTimeout, v.v.
# CB ignoreExceptions chung (business + concurrency + duplicate key + auth sai)
resilience4j.circuitbreaker.configs.business-as-usual.ignoreExceptions=\
  com.handle_exceptions.ConflictExceptionHandle,\
  com.handle_exceptions.NotFoundExceptionHandle,\
  com.handle_exceptions.ValidationExceptionHandle,\
  com.handle_exceptions.UnauthorizedExceptionHandle,\
  com.handle_exceptions.ForbiddenExceptionHandle,\
  com.handle_exceptions.TooManyRequestsExceptionHandle,\
  org.springframework.dao.OptimisticLockingFailureException,\
  org.springframework.dao.ConcurrencyFailureException,\
  org.springframework.dao.DataIntegrityViolationException,\
  org.springframework.dao.DuplicateKeyException,\
  jakarta.persistence.OptimisticLockException,\
  org.springframework.orm.jpa.JpaOptimisticLockingFailureException,\
  org.hibernate.StaleStateException,\
  org.springframework.security.authentication.BadCredentialsException,\
  org.springframework.security.access.AccessDeniedException

# config chung cho read operations
resilience4j.circuitbreaker.configs.service-default-read.base-config=business-as-usual
resilience4j.circuitbreaker.configs.service-default-read.slidingWindowSize=50
resilience4j.circuitbreaker.configs.service-default-read.minimumNumberOfCalls=25
resilience4j.circuitbreaker.configs.service-default-read.failureRateThreshold=50
resilience4j.circuitbreaker.configs.service-default-read.waitDurationInOpenState=60s
resilience4j.circuitbreaker.configs.service-default-read.permittedNumberOfCallsInHalfOpenState=3

# config chung cho write operations
resilience4j.circuitbreaker.configs.service-default-write.base-config=business-as-usual
resilience4j.circuitbreaker.configs.service-default-write.slidingWindowSize=30
resilience4j.circuitbreaker.configs.service-default-write.minimumNumberOfCalls=15
resilience4j.circuitbreaker.configs.service-default-write.failureRateThreshold=50
resilience4j.circuitbreaker.configs.service-default-write.waitDurationInOpenState=60s
resilience4j.circuitbreaker.configs.service-default-write.permittedNumberOfCallsInHalfOpenState=3

# ======================================== Category Service ========================================
resilience4j.circuitbreaker.instances.category-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.category-service-write.base-config=service-default-write

# ======================================== MenuItem Service ========================================
resilience4j.circuitbreaker.instances.menu-item-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.menu-item-service-write.base-config=service-default-write

# ======================================== OrderItem Service ========================================
resilience4j.circuitbreaker.instances.order-item-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.order-item-service-write.base-config=service-default-write

resilience4j.circuitbreaker.instances.order-item-service-admin-write.base-config=service-default-write

# ======================================== Order Service ========================================
resilience4j.circuitbreaker.instances.order-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.order-service-write.base-config=service-default-write

resilience4j.circuitbreaker.instances.order-service-admin-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.order-service-admin-write.base-config=service-default-write

# ======================================== Payment Service ========================================
resilience4j.circuitbreaker.instances.payment-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.payment-service-write.base-config=service-default-write

# ======================================== Reservation Service ========================================
resilience4j.circuitbreaker.instances.reservation-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.reservation-service-write.base-config=service-default-write

resilience4j.circuitbreaker.instances.reservation-service-admin-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.reservation-service-admin-write.base-config=service-default-write

# ======================================== Shift Service ========================================
resilience4j.circuitbreaker.instances.shift-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.shift-service-write.base-config=service-default-write

# ======================================== Table Service ========================================
resilience4j.circuitbreaker.instances.table-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.table-service-write.base-config=service-default-write

# ======================================== User Service ========================================
resilience4j.circuitbreaker.instances.user-service-read.base-config=service-default-read
resilience4j.circuitbreaker.instances.user-service-write.base-config=service-default-write

resilience4j.circuitbreaker.instances.user-service-admin-write.base-config=service-default-write

# ============================ User Service Login / Logout / register / Verify ================================
resilience4j.circuitbreaker.instances.user-service-login-logout.base-config=service-default-read
resilience4j.circuitbreaker.instances.user-service-login-logout.slidingWindowSize=80
resilience4j.circuitbreaker.instances.user-service-login-logout.minimumNumberOfCalls=40

resilience4j.circuitbreaker.instances.user-service-register-verify.base-config=service-default-write
resilience4j.circuitbreaker.instances.user-service-register-verify.slidingWindowSize=40
resilience4j.circuitbreaker.instances.user-service-register-verify.minimumNumberOfCalls=20

# Đơn PENDING quá số phút sẽ bị scheduler hủy (giải phóng bàn cho giỏ hàng / đặt bàn).
order.pending.expiry-minutes=${ORDER_PENDING_EXPIRY_MINUTES:5}
order.pending.expiry-check-interval-ms=${ORDER_PENDING_EXPIRY_CHECK_MS:60000}

# CONFIRMED chưa thanh toán đủ (DINE_IN + DELIVERY) / payment PENDING treo — scheduler hủy sau TTL (phút).
order.confirmed.unpaid.expiry-minutes=${ORDER_CONFIRMED_UNPAID_EXPIRY_MINUTES:30}
order.confirmed.unpaid.expiry-check-interval-ms=${ORDER_CONFIRMED_UNPAID_EXPIRY_CHECK_MS:60000}

# ========================================
# VNPAY SANDBOX / PRODUCTION (không commit secret — dùng biến môi trường)
# ReturnUrl / IPN trên Merchant Admin phải trùng host+path thực tế (IPN cần HTTPS public, vd ngrok).
# ========================================
# vnpay.tmn-code=${VNPAY_TMN_CODE:}
# vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payments/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/payments/vnpay/ipn}
# SPA nhận return (vd http://localhost:3000 hoặc http://localhost:3000/payment/vnpay-return)
vnpay.frontend-redirect-base=${VNPAY_FRONTEND_REDIRECT_BASE:http://localhost:3000}